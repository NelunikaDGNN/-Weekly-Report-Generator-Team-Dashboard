<div class="user-list-page">
  <div class="page-header">
    <h2>User Management</h2>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filter by role</mat-label>
      <mat-select [ngModel]="roleFilter()" (ngModelChange)="onFilterChange($event)">
        <mat-option value="">All users</mat-option>
        <mat-option value="TEAM_MEMBER">Team Members</mat-option>
        <mat-option value="MANAGER">Managers</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="alert error" *ngIf="errorMessage()">{{ errorMessage() }}</div>
  <div class="alert success" *ngIf="successMessage()">{{ successMessage() }}</div>

  <div class="loading-state" *ngIf="loading()">Loading users...</div>

  <table mat-table [dataSource]="users()" *ngIf="!loading()" class="users-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">
        {{ user.name }}
        <span class="you-tag" *ngIf="isSelf(user)">(you)</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        <mat-chip [class.manager-chip]="user.role === 'MANAGER'">{{ user.role.replace('_', ' ') }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="joined">
      <th mat-header-cell *matHeaderCellDef>Joined</th>
      <td mat-cell *matCellDef="let user">{{ user.createdAt | date }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button
          mat-stroked-button
          (click)="toggleRole(user)"
          [disabled]="isSelf(user)"
          matTooltip="You cannot change your own role"
          [matTooltipDisabled]="!isSelf(user)"
        >
          Make {{ user.role === 'MANAGER' ? 'Team Member' : 'Manager' }}
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="deleteUser(user)"
          [disabled]="isSelf(user)"
          matTooltip="You cannot delete your own account"
          [matTooltipDisabled]="!isSelf(user)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
