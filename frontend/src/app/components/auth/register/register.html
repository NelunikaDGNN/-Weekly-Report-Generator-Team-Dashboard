<div class="register-container">
  <h2>Register</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
      <span class="error" *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
        Name is required
      </span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <span class="error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
        Valid email is required
      </span>
    </div>

<div class="form-group">
  <label for="password">Password</label>
  <div class="password-wrapper">
    <input
      id="password"
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
    />
    <button type="button" class="toggle-btn" (click)="togglePassword()">
      <lucide-angular [img]="showPassword() ? EyeOffIcon : EyeIcon" [size]="18"></lucide-angular>
    </button>
  </div>
  <span class="error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
    Password must be at least 6 characters
  </span>
</div>

<div class="form-group">
  <label for="confirmPassword">Confirm Password</label>
  <div class="password-wrapper">
    <input
      id="confirmPassword"
      [type]="showConfirmPassword() ? 'text' : 'password'"
      formControlName="confirmPassword"
    />
    <button type="button" class="toggle-btn" (click)="toggleConfirmPassword()">
      <lucide-angular [img]="showConfirmPassword() ? EyeOffIcon : EyeIcon" [size]="18"></lucide-angular>
    </button>
  </div>
  <span class="error" *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['passwordMismatch']">
    Passwords do not match
  </span>
</div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="registerForm.invalid || loading">
      {{ loading ? 'Creating account...' : 'Register' }}
    </button>
  </form>

  <p>Already have an account? <a routerLink="/login">Login</a></p>
</div>
