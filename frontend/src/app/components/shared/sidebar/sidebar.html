<mat-nav-list>
  <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
    <mat-icon matListItemIcon>dashboard</mat-icon>
    <span matListItemTitle>Dashboard</span>
  </a>

  <a mat-list-item routerLink="/reports/my-report" routerLinkActive="active-link">
    <mat-icon matListItemIcon>description</mat-icon>
    <span matListItemTitle>My Weekly Report</span>
  </a>

  <a mat-list-item routerLink="/reports/history" routerLinkActive="active-link">
    <mat-icon matListItemIcon>history</mat-icon>
    <span matListItemTitle>Report History</span>
  </a>

  <a mat-list-item routerLink="/projects" routerLinkActive="active-link">
    <mat-icon matListItemIcon>folder</mat-icon>
    <span matListItemTitle>Projects</span>
  </a>

  <ng-container *ngIf="authService.isManager()">
    <mat-divider></mat-divider>
    <div class="section-label">Manager</div>

    <a mat-list-item routerLink="/reports/team" routerLinkActive="active-link">
      <mat-icon matListItemIcon>groups</mat-icon>
      <span matListItemTitle>Team Reports</span>
    </a>

    <a mat-list-item routerLink="/users" routerLinkActive="active-link">
      <mat-icon matListItemIcon>manage_accounts</mat-icon>
      <span matListItemTitle>User Management</span>
    </a>
  </ng-container>
</mat-nav-list>
